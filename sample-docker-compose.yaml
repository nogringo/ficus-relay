services:
  ficus-relay:
    image: ghcr.io/nogringo/ficus-relay:latest
    # Or build it from this repository:
    # build: .
    restart: unless-stopped
    volumes:
      # Set relay.bind = "0.0.0.0", relay.auth.serviceUrl and banyan.admins in it, see docs/DEPLOYMENT.md
      - /path/to/strfry.conf:/etc/strfry.conf
      - /path/to/strfry-db:/app/strfry-db
    ports:
      - "127.0.0.1:7777:7777"
