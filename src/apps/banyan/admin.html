<style>
:root {
  --bg: #f5f4ef; --surface: #ffffff; --surface-2: #eeede6; --text: #1c1f1b; --muted: #61665d; --border: #dddbd2;

  }
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }

p { margin: 0 0 10px; }

.id { display: flex; flex-direction: column; min-width: 0; }

.av { width: 36px; height: 36px; flex: none; border-radius: 50%; object-fit: cover; display: inline-flex; align-items: center; justify-content: center; background: hsl(var(--h, 140) 35% 48%); color: #fff; font-weight: 600; font-size: .9rem; }

summary { cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 10px 0; list-style: none; }

summary::before { content: ""; border-left: 5px solid var(--muted); border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .15s; }

.members { list-style: none; margin: 0 0 8px; padding: 0; }

.r-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.relay.on .dot { background: var(--ok); }
.state { font-size: .8rem; color: var(--muted); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin: 10px 0 0; }
.kv div { display: flex; flex-direction: column; }

.kv dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.r-err { margin: 8px 0 0; color: var(--danger); font-family: var(--mono); font-size: .8rem; overflow-wrap: anywhere; }
@media (max-width: 820px) {
  .cols { grid-template-columns: minmax(0, 1fr); }

  .add, .urls, .tenant { grid-template-columns: minmax(0, 1fr); }

  .head input { flex: 1 1 100%; }
}

<header class="top">

<main id="app"><p class="muted pad">Loading...</p></main>
<script>
"use strict";
const KEY = "banyan-admin-pubkey";
const S = { pubkey: null, admin: false, own: null, limits: null, nav: 0, tenants: null, tenant: null, byPk: new Map(), filter: "" };
const $ = sel => document.querySelector(sel);
const app = $("#app");
const WEIGHTS = ["reply", "repost", "reaction", "zap", "mention"];
const CIRCLES = [["owner", "Owner"], ["pinned", "Pinned"], ["primary", "Primary circle"], ["secondary", "Secondary circle"]];
const LOADING = '<p class="muted pad">Loading...</p>';
const BACK = '<a class="back" href="#/">&larr; All people</a>';
const BAD_PK = "Enter a valid npub or a 64-character hex pubkey.";
const BAD_ID = "Enter a note1, nevent1 or 64-character hex event id.";
const RTF = new Intl.RelativeTimeFormat("en", { numeric: "auto" });

const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmt = n => (Number.isFinite(+n) ? +n : 0).toLocaleString("en");
const cap = s => s[0].toUpperCase() + s.slice(1);
const errText = e => (e && e.message) || String(e);
const short = v => { const n = String(v ?? ""); return n.length > 24 ? n.slice(0, 12) + "..." + n.slice(-6) : n; };
const safeDecode = s => { try { return decodeURIComponent(s); } catch { return s; } };
const wsBase = () => (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/";
const relayUrl = t => t.relayUrl || wsBase() + t.slug;
const npubOf = t => t.npub || npubEncode(t.pubkey);
const when = ts => (ts ? new Date(ts * 1000).toLocaleString("en", { dateStyle: "medium", timeStyle: "short" }) : "");

function ago(ts) {
  if (!ts) return "never";
  const d = ts - Date.now() / 1000;
  for (const [unit, sec] of [["year", 31536000], ["month", 2592000], ["week", 604800], ["day", 86400], ["hour", 3600], ["minute", 60]]) {
    if (Math.abs(d) >= sec) return RTF.format(Math.trunc(d / sec), unit);
  }
  return "just now";
}

function slugError(s) {
  if (!/^[a-z0-9][a-z0-9_-]{0,31}$/.test(s)) return "The slug must be 1 to 32 characters: lowercase letters, digits, '-' or '_', starting with a letter or digit.";
  if (s.startsWith("npub1")) return "The slug cannot start with npub1.";
  return "";
}

const BECH = "qpzry9x8gf2tvdw0s3jn54khce6mua7l";
function polymod(values) {
  const gen = [0x3b6a57b2, 0x26508e6d, 0x1ea119fa, 0x3d4233dd, 0x2a1462b3];
  let chk = 1;
  for (const v of values) {
    const top = chk >>> 25;
    chk = ((chk & 0x1ffffff) << 5) ^ v;
    for (let i = 0; i < 5; i++) if ((top >>> i) & 1) chk ^= gen[i];
  }
  return chk;
}
function hrpExpand(hrp) {
  const codes = [...hrp].map(c => c.charCodeAt(0));
  return [...codes.map(c => c >> 5), 0, ...codes.map(c => c & 31)];
}
function convertBits(data, from, to, pad) {
  let acc = 0, bits = 0;
  const out = [], max = (1 << to) - 1;
  for (const v of data) {
    acc = ((acc << from) | v) & 0xffffff;
    bits += from;
    while (bits >= to) { bits -= to; out.push((acc >> bits) & max); }
  }
  if (pad && bits) out.push((acc << (to - bits)) & max);
  else if (!pad && (bits >= from || ((acc << (to - bits)) & max))) return null;
  return out;
}
const hexOfBytes = bytes => bytes.map(b => b.toString(16).padStart(2, "0")).join("");
function bech32Encode(hrp, hex) {
  const data = convertBits(hex.match(/../g).map(h => parseInt(h, 16)), 8, 5, true);
  const mod = polymod([...hrpExpand(hrp), ...data, 0, 0, 0, 0, 0, 0]) ^ 1;
  let out = hrp + "1";
  for (const d of data) out += BECH[d];
  for (let i = 0; i < 6; i++) out += BECH[(mod >>> (5 * (5 - i))) & 31];
  return out;
}
function bech32Decode(str) {
  const s = String(str ?? "").trim();
  if (s !== s.toLowerCase() && s !== s.toUpperCase()) return null;
  const low = s.toLowerCase(), sep = low.lastIndexOf("1");
  if (sep < 1 || low.length > 5000) return null;
  const hrp = low.slice(0, sep), data = [...low.slice(sep + 1)].map(c => BECH.indexOf(c));
  if (data.length < 6 || data.includes(-1) || polymod([...hrpExpand(hrp), ...data]) !== 1) return null;
  const bytes = convertBits(data.slice(0, -6), 5, 8, false);
  return bytes ? { hrp, bytes } : null;
}
function npubEncode(hex) {
  return /^[0-9a-f]{64}$/i.test(hex || "") ? bech32Encode("npub", hex.toLowerCase()) : String(hex ?? "");
}
function npubDecode(str) {
  const d = bech32Decode(str);
  return d && d.hrp === "npub" && d.bytes.length === 32 ? hexOfBytes(d.bytes) : null;
}
const noteOf = hex => /^[0-9a-f]{64}$/i.test(hex || "") ? bech32Encode("note", hex.toLowerCase()) : String(hex ?? "");
// note1, nevent1 (TLV type 0 is the id) or hex
function eventIdToHex(input) {
  let s = String(input ?? "").trim();
  if (s.startsWith("nostr:")) s = s.slice(6);
  if (/^[0-9a-f]{64}$/i.test(s)) return s.toLowerCase();
  const d = bech32Decode(s);
  if (!d) return null;
  if (d.hrp === "note") return d.bytes.length === 32 ? hexOfBytes(d.bytes) : null;
  if (d.hrp !== "nevent") return null;
  for (let i = 0; i + 2 <= d.bytes.length; i += 2 + d.bytes[i + 1]) {
    if (d.bytes[i] === 0 && d.bytes[i + 1] === 32) return hexOfBytes(d.bytes.slice(i + 2, i + 34));
  }
  return null;
}
function toHex(input) {
  const s = String(input ?? "").trim();
  return /^[0-9a-f]{64}$/i.test(s) ? s.toLowerCase() : npubDecode(s);
}

let lastSignedAt = 0;
const hexOf = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
function b64(str) {
  let bin = "";
  for (const b of new TextEncoder().encode(str)) bin += String.fromCharCode(b);
  return btoa(bin);
}
async function rpc(method, params = []) {
  if (!window.nostr) throw new Error("No NIP-07 extension found.");
  if (!crypto.subtle) throw new Error("Open this page over https (or on localhost): the browser only hashes requests in a secure context.");
  const url = location.origin + "/", body = JSON.stringify({ method, params });
  const payload = hexOf(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(body)));
  // The relay refuses a reused event id, and the same request twice in one second would sign identical events.
  const createdAt = lastSignedAt = Math.max(Math.floor(Date.now() / 1000), lastSignedAt + 1);
  let evt, res, data;
  try {
    evt = await window.nostr.signEvent({ kind: 27235, created_at: createdAt, content: "", tags: [["u", url], ["method", "POST"], ["payload", payload]] });
  } catch (e) { throw new Error("The extension did not sign the request: " + errText(e)); }
  try {
    res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/nostr+json+rpc", Authorization: "Nostr " + b64(JSON.stringify(evt)) }, body });
  } catch (e) { throw new Error("Could not reach the relay: " + errText(e)); }
  try { data = await res.json(); } catch { throw new Error(`The relay answered HTTP ${res.status} without JSON.`); }
  if (data && data.error) throw new Error(String(data.error));
  if (!res.ok) throw new Error(`The relay answered HTTP ${res.status}.`);
  return data ? data.result : null;
}

function setMsg(key, text, kind = "err") {
  for (const el of document.querySelectorAll(`[data-msg="${key}"]`)) {
    el.textContent = text || "";
    el.className = "msg " + kind;
    el.hidden = !text;
  }
}
function flash(btn, text) {
  if (!btn.dataset.label) btn.dataset.label = btn.textContent;
  btn.textContent = text;
  clearTimeout(btn._flash);
  btn._flash = setTimeout(() => { btn.textContent = btn.dataset.label; delete btn.dataset.label; }, 1500);
}
async function act(btn, busy, key, fn) {
  setMsg(key, "");
  const label = btn.dataset.label || btn.textContent;
  btn.disabled = true;
  if (busy) btn.textContent = busy;
  let done;
  try { done = await fn(); } catch (e) { setMsg(key, errText(e)); }
  btn.disabled = false;
  btn.textContent = label;
  if (typeof done === "string") flash(btn, done);
}
async function copyText(btn) {
  const text = btn.dataset.copy;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand("copy"); } catch {}
    ta.remove();
  }
  flash(btn, ok ? "Copied" : "Failed");
}

function httpsUrl(u) {
  try { const x = new URL(u); return x.protocol === "https:" ? x.href : null; } catch { return null; }
}
function avatar(m) {
  const hue = (parseInt(String(m.pubkey).slice(0, 4), 16) || 0) % 360, pic = httpsUrl(m.picture);
  if (pic) return `<img class="av" style="--h:${hue}" src="${esc(pic)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">`;
  return `<span class="av" style="--h:${hue}" aria-hidden="true">${esc(([...String(m.name || "").trim()][0] || "").toUpperCase())}</span>`;
}
function nameOf(pk) {
  const m = S.byPk.get(pk);
  return (m && m.name) || short(npubEncode(pk));
}
function idCell(pk, m, extra = "") {
  const n = (m && m.npub) || npubEncode(pk), name = m && m.name;
  return `<div class="id" title="${esc(n)}"><span class="name${name ? "" : " mono"}">${esc(name || short(n))}</span>${name ? `<span class="mono muted small">${esc(short(n))}</span>` : ""}${extra}</div>`;
}
const urlRow = u => `<div class="url-row"><code>${esc(u)}</code><button class="btn ghost sm copy" data-act="copy" data-copy="${esc(u)}">Copy</button></div>`;

function store(pk) { try { if (pk) sessionStorage.setItem(KEY, pk); else sessionStorage.removeItem(KEY); } catch {} }
function stored() { try { return sessionStorage.getItem(KEY); } catch { return null; } }
async function waitNostr() {
  // Extensions often inject window.nostr shortly after the page loads.
  for (let i = 0; i < 15 && !window.nostr; i++) await new Promise(r => setTimeout(r, 100));
  return !!window.nostr;
}

function setHeader() {
  $("#who").hidden = !S.pubkey;
  $("#nav").hidden = !S.admin;
  $("#brand").textContent = S.pubkey && !S.admin && S.own ? "Banyan" : "Banyan admin";
  if (!S.pubkey) return;
  const n = npubEncode(S.pubkey), el = $("#who-npub");
  el.textContent = short(n);
  el.title = n;
}
function renderLogin(msg) {
  S.nav++;
  S.pubkey = null;
  S.admin = false;
  S.own = null;
  setHeader();

async function saveSettings(form) {
  const f = form.elements, patch = { weights: {} };
  const read = (name, label, int) => {
    const raw = f[name].value.trim(), v = Number(raw);
    if (raw === "" || !Number.isFinite(v)) throw new Error(`${label} must be a number.`);
    if (int && (!Number.isInteger(v) || v < 0)) throw new Error(`${label} must be a whole number, 0 or more.`);
    return v;
  };
  try {
    for (const w of WEIGHTS) patch.weights[w] = read("w_" + w, cap(w) + " weight", false);
    patch.primaryCircleSize = read("primaryCircleSize", "Primary circle size", true);
    patch.secondaryPerPeer = read("secondaryPerPeer", "Secondary per peer", true);
    patch.minScore = read("minScore", "Minimum score", false);
    const lim = owner() ? S.limits || {} : {};
    for (const [k, label] of [["primaryCircleSize", "Primary circle size"], ["secondaryPerPeer", "Secondary per peer"]]) {
      if (lim[k] != null && patch[k] > lim[k]) throw new Error(`${label} can be at most ${fmt(lim[k])} on this server.`);
    }
    const slug = f.slug ? f.slug.value.trim() : S.tenant.slug;
    if (slug !== S.tenant.slug) {
      const bad = slugError(slug);
      if (bad) throw new Error(bad);
      patch.slug = slug;
    }
  } catch (e) { return setMsg("settings", e.message); }
  await act(form.querySelector("button"), "Saving...", "settings", async () => {
    const current = await tenantRpc("updatetenant", [S.tenant.pubkey, patch], true);
    if (current && patch.slug && !owner()) history.replaceState(null, "", "#/t/" + encodeURIComponent(S.tenant.slug));
    return "Saved";
  });
}

}

  <p class="muted small">The harvester fetches the events of every universe from other relays.</p>
  <p class="msg" data-msg="harvest" hidden></p>
  <div id="harvest">${LOADING}</div>
</section>`;
  try { await loadHarvest(); } catch (e) {
    setMsg("harvest", errText(e));
    const box = $("#harvest");
    if (box) box.innerHTML = "";
  }
}
async function loadHarvest() {
  const tok = S.nav, h = (await rpc("harveststatus", [])) || {};
  const box = $("#harvest");
  if (tok !== S.nav || !box) return;
  const relays = Array.isArray(h.relays) ? h.relays : [], on = relays.filter(r => r.connected).length;
  const auth = h.authPubkey ? `<p class="small muted">Answers NIP-42 AUTH as <span class="mono" title="${esc(npubEncode(h.authPubkey))}">${esc(short(npubEncode(h.authPubkey)))}</span>. Whitelist this key on paid or private relays. People with a remote signer sign in as themselves on their own relays.</p>` : "";
  box.innerHTML = `<p class="small">${fmt(h.targets)} pubkeys targeted, ${fmt(on)} of ${fmt(relays.length)} relays connected, ${fmt(h.delivered)} events delivered to inboxes, ${fmt(h.published)} published to their authors' relays. <span class="muted">Updated ${esc(new Date().toLocaleTimeString("en"))}.</span></p>${auth}`
    + (relays.length ? `<div class="relays">${relays.map(relayRow).join("")}</div>` : '<p class="muted empty">No relays in use yet.</p>');
}
function relayRow(r) {
  const stats = [["Subscriptions", r.subs], ["Authors", r.authors], ["Inbox targets", r.inboxTargets], ["Events received", r.eventsReceived], ["Delivered", r.delivered], ["Waiting to deliver", r.deliveryQueue]];
  const auth = { ok: ", authenticated", sent: ", authenticating", signing: ", waiting for the remote signer", wanted: ", waiting for an AUTH challenge", failed: ", AUTH refused" }[r.auth] || "";
  const role = r.role === "owner" && r.authAs ? ` as ${short(npubEncode(r.authAs))}` : r.role === "signer" ? " (remote signer)" : "";
  return `<article class="relay ${r.connected ? "on" : "off"}">
  <div class="r-head"><span class="dot"></span><span class="mono">${esc(r.url)}</span><span class="state">${r.connected ? "Connected" : "Disconnected"}${esc(auth + role)}</span></div>
  <dl class="kv">${stats.map(([k, v]) => `<div><dt>${k}</dt><dd>${fmt(v)}</dd></div>`).join("")}</dl>
  ${r.lastError ? `<p class="r-err">${esc(r.lastError)}</p>` : ""}
</article>`;
}

const ACTIONS = {
  login, logout, recompute,
  copy: copyText,
  refresh: btn => act(btn, "Refreshing...", "head", refreshTenant),
  remove: removeTenant,
  pin: btn => toggle(btn, "pinned", true),
  unpin: btn => toggle(btn, "pinned", false),
  block: btn => toggle(btn, "blocked", true),
  unblock: btn => toggle(btn, "blocked", false),
  unmute,
  nostrconnect: btn => signerRpc(btn, "nostrconnect", []),
  removesigner: removeRemoteSigner,
  harvest: btn => act(btn, "Refreshing...", "harvest", loadHarvest),
};
const FORMS = {
  "add-form": addTenant,
  "settings-form": saveSettings,
  "pin-form": f => addToList(f, "pinned"),
  "block-form": f => addToList(f, "blocked"),
  "mute-form": addMuted,
  "bunker-form": connectBunker,
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el) {
    e.preventDefault();
    const fn = ACTIONS[el.dataset.act];
    if (fn) fn(el);
    return;
  }
  const card = e.target.closest("[data-href]");
  if (card && !e.target.closest("a, button, input, code") && !String(getSelection())) location.hash = card.dataset.href;
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const fn = FORMS[e.target.id];
  if (fn) fn(e.target);
});
document.addEventListener("input", e => {
  if (e.target.id !== "member-filter") return;
  S.filter = e.target.value.trim();
  paintMembers();
});
document.addEventListener("error", e => {
  const img = e.target;
  if (!img || img.tagName !== "IMG") return;
  const span = document.createElement("span");
  span.className = img.className;
  span.style.cssText = img.style.cssText;
  img.replaceWith(span);
}, true);
addEventListener("hashchange", route);

async function boot() {
  const saved = stored();
  if ((await waitNostr()) && saved) enter(saved);
  else renderLogin();
}
boot();
</script>
</body>
