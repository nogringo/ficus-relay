config:
  - name: banyan__enabled
    desc: "Banyan mode: each person added by an admin gets a virtual relay at /<slug> and /<npub>, and WebSocket connections on / are refused"
    default: true
  - name: banyan__admins
    desc: "Comma-separated admin pubkeys (npub or hex) allowed to use the admin API and the /admin page"
    default: ""
  - name: banyan__acceptGiftWrapsForOwner
    desc: "Accept and serve kind 1059 gift wraps whose p-tag is the virtual relay's owner, even though their signer is outside the universe"
    default: true
  - name: banyan__acceptIncomingEngagement
    desc: "Accept, without serving them, events from outside the universe that the trust engine reads: engagement that mentions the owner, a pinned person or a primary member"
    default: true

  - name: banyan__owners__enabled
    desc: "Let each person manage their own virtual relay (pins, blocks, weights and circle sizes) through the admin API and the /admin page"
    default: true
  - name: banyan__owners__maxPrimaryCircleSize
    desc: "Largest primary circle a person can set on their own relay"
    default: 100
  - name: banyan__owners__maxSecondaryPerPeer
    desc: "Largest secondaryPerPeer a person can set on their own relay"
    default: 20
  - name: banyan__owners__maxPinned
    desc: "Maximum number of people a person can pin on their own relay"
    default: 200
  - name: banyan__owners__maxMutedThreads
    desc: "Maximum number of threads a person can mute on their own relay"
    default: 500

  - name: banyan__threads__maxEvents
    desc: "Maximum number of events a thread filter ({\"thread\": [id]}) follows, root included (0 disables thread filters)"
    default: 10000
  - name: banyan__threads__maxMutedEvents
    desc: "Maximum number of events one person's muted threads hide, roots included"
    default: 100000

  - name: banyan__prune__enabled
    desc: "Regularly delete events that no virtual relay serves and the trust engine does not read"
    default: false
  - name: banyan__prune__intervalSeconds
    desc: "How often the pruning runs, when enabled"
    default: 86400

  - name: banyan__trust__recomputeIntervalSeconds
    desc: "How often each person's trust universe is recomputed"
    default: 3600
  - name: banyan__trust__windowDays
    desc: "Only engagement newer than this is used to compute trust"
    default: 365
  - name: banyan__trust__halfLifeDays
    desc: "Engagement weight halves every this many days (0 disables decay)"
    default: 90
  - name: banyan__trust__primaryCircleSize
    desc: "Default maximum number of peers in the primary trust circle"
    default: 50
  - name: banyan__trust__secondaryPerPeer
    desc: "Default number of peers taken from each primary peer to form the secondary circle"
    default: 10
  - name: banyan__trust__minScore
    desc: "Default minimum mutual engagement score for a peer to enter a circle"
    default: 2
  - name: banyan__trust__weightReply
    desc: "Default weight of a reply"
    default: 3
  - name: banyan__trust__weightRepost
    desc: "Default weight of a repost"
    default: 2
  - name: banyan__trust__weightReaction
    desc: "Default weight of a reaction"
    default: 1
  - name: banyan__trust__weightZap
    desc: "Default weight of a zap"
    default: 4
  - name: banyan__trust__weightMention
    desc: "Default weight of a mention or quote"
    default: 1
  - name: banyan__trust__zapReferenceSats
    desc: "A zap of this many sats counts once, and about once more each time the amount doubles (0 counts every zap once)"
    default: 100
  - name: banyan__trust__verifyZapReceipts
    desc: "Only count zap receipts signed by the nostrPubkey of the recipient's LNURL server, found through the lud16 or lud06 of their profile"
    default: true

  - name: banyan__harvester__enabled
    desc: "Fetch the universe's events from other relays"
    default: true
  - name: banyan__harvester__bootstrapRelays
    desc: "Comma-separated relays used to find relay lists (kind 10002) and as a fallback for pubkeys without one"
    default: "wss://purplepag.es, wss://relay.primal.net, wss://relay.ditto.pub"
  - name: banyan__harvester__excludedRelays
    desc: "Comma-separated relays the harvester never connects to"
    default: ""
  - name: banyan__harvester__maxRelays
    desc: "Maximum number of relays the harvester stays connected to"
    default: 40
  - name: banyan__harvester__relaysPerPubkey
    desc: "Number of relays from a pubkey's relay list used to fetch its events"
    default: 2
  - name: banyan__harvester__backfillDays
    desc: "How far back the first backfill of a pubkey goes"
    default: 365
  - name: banyan__harvester__maxConcurrentReqsPerRelay
    desc: "Maximum number of backfill REQs open at once on one relay"
    default: 4
  - name: banyan__harvester__authorsPerFilter
    desc: "Maximum number of pubkeys in one harvester filter"
    default: 100
  - name: banyan__harvester__pageLimit
    desc: "limit sent in backfill filters (pagination goes on until a page comes back empty)"
    default: 500
  - name: banyan__harvester__replanIntervalSeconds
    desc: "How often the harvester recomputes which relays to use"
    default: 60
  - name: banyan__harvester__auth
    desc: "Answer NIP-42 AUTH challenges from other relays, with a key generated and stored in the database"
    default: true
  - name: banyan__harvester__allowPrivateAddresses
    desc: "Let the harvester connect to relays, and zap verification to LNURL servers, on private, loopback or link-local addresses, LNURL over plain http included (tests and private networks)"
    default: false

  - name: banyan__distributor__enabled
    desc: "Send the events of a universe to the inbox relays (NIP-65 read relays) of the universe members they mention"
    default: true
  - name: banyan__distributor__maxAgeSeconds
    desc: "Only events newer than this are sent to inbox and outbox relays"
    default: 86400
  - name: banyan__distributor__publishToOutbox
    desc: "Send what people of a universe publish on a virtual relay to their own write relays (NIP-65)"
    default: true

  - name: banyan__signer__enabled
    desc: "Let people connect a NIP-46 remote signer, so the harvester can AUTH as them on relays that only serve them their own data"
    default: true
  - name: banyan__signer__relays
    desc: "Comma-separated relays offered to remote signers in nostrconnect:// links"
    default: "wss://promenade.fiatjaf.com, wss://relay.ditto.pub, wss://relay.primal.net"
